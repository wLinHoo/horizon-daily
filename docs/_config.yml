theme: jekyll-theme-cayman
title: Horizon 中文日报
description: AI 与科技资讯
lang: zh-CN
baseurl: "/horizon-daily"
url: "https://wlinhoo.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"
  - "feed-en.xml"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
